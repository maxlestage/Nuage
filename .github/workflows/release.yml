name: Release

# A tag `v0.3.0` publishes the release `v0.3.0`: the `nuage` binary for Linux (static,
# x86_64 and ARM64: any distribution), macOS and Windows, each with its sha256. install.sh
# downloads the Linux ones. Then Nuage DB Editor, the window for those who would rather not
# use a terminal, is added to it: one macOS application for Apple silicon and Intel (.dmg), a
# Windows program (.exe) and a Linux desktop program (.tar.gz). A failure of the editor's
# packaging never holds the server's release back.
#
# A pull request that touches the editor or this file builds and checks the editor's packages
# (nothing is published).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - crates/nuage-editor/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release (made on the chosen branch's last commit if it does not exist)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (static, with zig as the linker)
        if: matrix.zig
        run: |
          pip install ziglang cargo-zigbuild
          cargo zigbuild --release --locked -p nuage --bin nuage --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p nuage --bin nuage --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          dir=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            name=nuage-${{ matrix.target }}.zip
            cp "$dir/nuage.exe" LICENSE README.md dist/
            (cd dist && 7z a -bd -tzip "../$name" nuage.exe LICENSE README.md >/dev/null)
          else
            name=nuage-${{ matrix.target }}.tar.gz
            cp "$dir/nuage" LICENSE README.md dist/
            tar -czf "$name" -C dist nuage LICENSE README.md
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          cat "$name.sha256"
          mkdir out && mv "$name" "$name.sha256" out/
      - name: Check that the Linux binary is static and runs
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file target/${{ matrix.target }}/release/nuage
          target/${{ matrix.target }}/release/nuage --version
      - uses: actions/upload-artifact@v5
        with:
          name: server-${{ matrix.target }}
          path: out/*

  editor:
    name: editor ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, targets: x86_64-unknown-linux-gnu }
          - { name: macos, os: macos-latest, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { name: windows, os: windows-latest, targets: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: editor-${{ matrix.name }}
      - name: Version (the workspace's, as the program says it)
        shell: bash
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"

      # Linux: glibc 2.31 (Ubuntu 20.04, Debian 11 and later), with zig as the linker. Not musl:
      # winit and glutin open X11, Wayland and OpenGL at run time, which a static binary cannot.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install ziglang cargo-zigbuild
          cargo zigbuild --profile release-editor --locked -p nuage-editor --bin nuage-editor --target x86_64-unknown-linux-gnu.2.31
          echo "BIN=target/x86_64-unknown-linux-gnu/release-editor/nuage-editor" >> "$GITHUB_ENV"
      - name: The Linux program needs only the C library, and glibc 2.31 at most
        if: runner.os == 'Linux'
        run: |
          ldd "$BIN"
          # glibc's own libraries (libpthread, libdl and librt were apart until glibc 2.34) and
          # the loader; the desktop's libraries are opened when the window opens.
          extra=$(ldd "$BIN" | awk '{ print $1 }' | grep -vxE 'linux-vdso\.so\.1|libc\.so\.6|libm\.so\.6|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|libgcc_s\.so\.1|/lib64/ld-linux-x86-64\.so\.2' || true)
          if [ -n "$extra" ]; then echo "::error::the program links $extra"; exit 1; fi
          newest=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -n1)
          echo "newest glibc symbol: $newest"
          if [ "$(printf '%s\n' "$newest" GLIBC_2.31 | sort -V | tail -n1)" != GLIBC_2.31 ]; then
            echo "::error::$newest is newer than glibc 2.31"; exit 1
          fi
          size=$(stat -c %s "$BIN"); echo "size: $size bytes"
          if [ "$size" -ge 26214400 ]; then echo "::error::the program is over 25 MB"; exit 1; fi

      # macOS: one program for Apple silicon and Intel, so nobody needs to know which Mac they have.
      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --profile release-editor --locked -p nuage-editor --bin nuage-editor --target $target
          done
          mkdir -p target/universal
          lipo -create -output target/universal/nuage-editor \
            target/aarch64-apple-darwin/release-editor/nuage-editor target/x86_64-apple-darwin/release-editor/nuage-editor
          lipo -info target/universal/nuage-editor
          echo "BIN=target/universal/nuage-editor" >> "$GITHUB_ENV"
          ls -l target/universal/nuage-editor

      # Windows: the C runtime inside, so a fresh Windows needs no Visual C++ package.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --profile release-editor --locked -p nuage-editor --bin nuage-editor --target x86_64-pc-windows-msvc
          echo "BIN=target/x86_64-pc-windows-msvc/release-editor/nuage-editor.exe" >> "$GITHUB_ENV"
          ls -l target/x86_64-pc-windows-msvc/release-editor/nuage-editor.exe

      # The real window opens and draws on each system before anyone downloads it.
      - name: What a Linux desktop has (an X server in memory, Mesa's OpenGL)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libgl1 libegl1 libgl1-mesa-dri
      - name: The window opens (--self-test)
        shell: bash
        run: |
          run="$BIN"
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a $BIN"; fi
          $run --self-test self-test.json
          cat self-test.json

      - name: Package
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows)
              # A bare program: nothing to unzip.
              name=Nuage-DB-Editor-windows-x64.exe
              cp "$BIN" "out/$name"
              ;;
            macOS)
              app="dist/Nuage DB Editor.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$BIN" "$app/Contents/MacOS/nuage-editor"
              sed "s/@VERSION@/$VERSION/g" crates/nuage-editor/packaging/macos/Info.plist > "$app/Contents/Info.plist"
              for lang in en fr es; do
                cp -R "crates/nuage-editor/packaging/macos/$lang.lproj" "$app/Contents/Resources/"
              done
              icons=$(mktemp -d)/AppIcon.iconset && mkdir -p "$icons"
              for size in 16 32 128 256 512; do
                sips -z $size $size crates/nuage-site/static/icon-512.png --out "$icons/icon_${size}x${size}.png" >/dev/null
                double=$((size * 2)); [ $double -le 512 ] || double=512
                sips -z $double $double crates/nuage-site/static/icon-512.png --out "$icons/icon_${size}x${size}@2x.png" >/dev/null
              done
              iconutil -c icns "$icons" -o "$app/Contents/Resources/AppIcon.icns"
              cp LICENSE "$app/Contents/Resources/"
              plutil -lint "$app/Contents/Info.plist"
              # Signed for no one in particular (no Apple developer certificate): Apple silicon
              # runs no unsigned code, and lipo leaves the linker's signature invalid.
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
              mkdir dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
              name=Nuage-DB-Editor-macOS.dmg
              # hdiutil fails now and then on the runners ("Resource busy"): three tries.
              for try in 1 2 3; do
                hdiutil create -volname "Nuage DB Editor" -srcfolder dmg -ov -format UDZO "out/$name" && break
                [ "$try" -lt 3 ] || exit 1
                sleep 10
              done
              ;;
            Linux)
              name=nuage-editor-x86_64-linux.tar.gz
              mkdir dist
              cp "$BIN" LICENSE crates/nuage-editor/packaging/linux/* dist/
              tar -czf "out/$name" -C dist .
              tar -tzvf "out/$name"
              ;;
          esac
          cd out
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          cat "$name.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: editor-${{ matrix.name }}
          path: out/*

  publish:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: server-*
          path: out
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        run: |
          v=${TAG#v}
          awk -v v="$v" '$0 ~ "^## \\[?" v "\\]?" { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install on a server

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | sudo bash
          \`\`\`
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Nuage DB ${{ env.TAG }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true

  # The editor's files join the release the server's made: those of the systems whose
  # packaging worked, even if another's failed.
  editor-publish:
    needs: [publish, editor]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: editor-*
          path: out
          merge-multiple: true
      - name: Notes for the editor (first opening, in three languages)
        run: |
          cat > notes.md <<'EOF'

          ## Desktop editor / Éditeur de bureau / Editor de escritorio

          **Nuage DB Editor**: the server's settings, applications and tokens in a window, for those
          who would rather not use a terminal. It is not signed with a developer certificate, so the
          first opening asks once:

          - **macOS** (11 and later, Apple silicon and Intel): `Nuage-DB-Editor-macOS.dmg`. Open it,
            drag *Nuage DB Editor* to Applications, open it. macOS says it cannot check it: System
            Settings, Privacy & Security, **Open Anyway**, then your password. After an update, the
            Keychain may ask once to let the new version read a kept token: **Always Allow**.
          - **Windows** (10 and 11): `Nuage-DB-Editor-windows-x64.exe`. Edge may say the file is not
            commonly downloaded: **Keep**. SmartScreen says "Windows protected your PC": **More info**,
            then **Run anyway**.
          - **Linux** (x86_64, glibc 2.31 and later: Ubuntu 20.04, Debian 11): `nuage-editor-x86_64-linux.tar.gz`.
            Unpack it; GNOME Files does not start a program on a double-click: right-click, **Run as a
            Program**. README.txt says how to add it to the menu.

          **Nuage DB Éditeur** : les réglages, les applications et les jetons du serveur dans une
          fenêtre, sans terminal. Il n'est pas signé par un certificat de développeur : la première
          ouverture demande une fois. macOS : `Nuage-DB-Editor-macOS.dmg`, glissez *Nuage DB Editor*
          dans Applications ; à l'ouverture, Réglages Système, Confidentialité et sécurité, **Ouvrir
          quand même**, puis votre mot de passe. Windows : `Nuage-DB-Editor-windows-x64.exe` ;
          « Windows a protégé votre ordinateur » : **Informations complémentaires**, puis **Exécuter
          quand même**. Linux : `nuage-editor-x86_64-linux.tar.gz`, clic droit, **Exécuter comme un
          programme**.

          **Nuage DB Editor**: los ajustes, las aplicaciones y los tokens del servidor en una
          ventana, sin terminal. No está firmado con un certificado de desarrollador: la primera vez
          pregunta. macOS: `Nuage-DB-Editor-macOS.dmg`, arrastra *Nuage DB Editor* a Aplicaciones; al
          abrirlo, Ajustes del Sistema, Privacidad y seguridad, **Abrir igualmente**, y tu contraseña.
          Windows: `Nuage-DB-Editor-windows-x64.exe`; «Windows protegió su PC»: **Más información** y
          **Ejecutar de todas formas**. Linux: `nuage-editor-x86_64-linux.tar.gz`, clic derecho,
          **Ejecutar como un programa**.
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: notes.md
          append_body: true
          files: out/*
          fail_on_unmatched_files: true
