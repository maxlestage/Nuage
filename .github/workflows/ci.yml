name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (both crates, every target, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (nuage without the website)
        run: cargo clippy -p nuage --all-targets --no-default-features --locked -- -D warnings
      - name: Clippy (the site's browser bundle, wasm32)
        run: cargo clippy -p nuage-site --lib --target wasm32-unknown-unknown --locked -- -D warnings
      # The server (Docker, Heroku, the releases install.sh downloads) never compiles a window
      # crate: the editor depends on the server for its tests only, never the other way round.
      - name: The server's dependencies hold no window crate
        run: |
          cargo tree -p nuage --all-features --target all -e normal,build --prefix none --locked > server.txt
          gui='eframe|egui|egui-winit|egui_glow|egui-wgpu|winit|wgpu|glow|glutin|keyring|ureq|arboard|winresource'
          found=$(sed 's/ .*//' server.txt | sort -u | grep -xE "$gui" || true)
          if [ -n "$found" ]; then echo "::error::nuage depends on window crates: $found"; exit 1; fi
          # The editor on Linux: no wgpu (Windows only), no fontconfig, and not the server.
          cargo tree -p nuage-editor --target x86_64-unknown-linux-gnu -e normal --prefix none --locked > editor.txt
          found=$(sed 's/ .*//' editor.txt | sort -u | grep -xE 'wgpu|naga|fontconfig-sys|nuage' || true)
          if [ -n "$found" ]; then echo "::error::nuage-editor for Linux depends on: $found"; exit 1; fi
          echo "nuage: $(sed 's/ .*//' server.txt | sort -u | wc -l) crates, none of a window"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine, embedded mode, server, console, backups, website, editor (and doc tests)
        run: cargo test --workspace --all-features --locked

  editor:
    # Nuage DB Editor is a window: it is built, and driven headless through its accessibility
    # tree against a real server, on the three systems people double-click it on (Linux's
    # clippy and tests are the lint and test jobs'). Then its real window opens once.
    name: Editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (the code of this system, windows-sys and osascript)
        if: runner.os != 'Linux'
        run: cargo clippy -p nuage-editor --all-targets --locked -- -D warnings
      - name: Tests (the window against a server in the same process, Windows' pipe and findstr)
        if: runner.os != 'Linux'
        run: cargo test -p nuage-editor --locked
      # GitHub's Windows runners elevate without asking: the UAC path runs for real. If it ever
      # waits for a click, it stops here (it is then for the checklist before a release).
      - name: The elevated read of Windows (UAC)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        continue-on-error: true
        run: cargo test -p nuage-editor --locked --lib -- --ignored elevated
      - name: The program builds
        run: cargo build -p nuage-editor --bin nuage-editor --locked
      - name: What a Linux desktop has (an X server in memory, Mesa's OpenGL)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libgl1 libegl1 libgl1-mesa-dri
      # The real window draws a few frames and closes (Windows: Direct3D 12, WARP on a runner
      # without a graphics card). macOS runners are virtual machines whose OpenGL may be
      # refused: a failure there is shown, and checked again before a release.
      - name: The window opens (--self-test)
        shell: bash
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
        run: |
          run=target/debug/nuage-editor
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a $run"; fi
          $run --self-test self-test.json
          cat self-test.json
      - name: The window opens with OpenGL asked first (it falls back where there is no driver)
        if: runner.os == 'Windows'
        shell: bash
        env:
          NUAGE_EDITOR_RENDERER: glow
        run: |
          target/debug/nuage-editor --self-test self-test.json
          cat self-test.json

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The `rust-version` of crates/nuage (the workspace's).
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  pkg:
    name: Browser bundle up to date (crates/nuage-site/pkg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolchain the committed bundle is built with (RustConfig, Dockerfile): the
      # WebAssembly output depends on the compiler version.
      - uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          wasm-bindgen --version
      - name: Rebuild the bundle and compare
        run: |
          crates/nuage-site/build-wasm.sh
          if ! git diff --exit-code --stat -- crates/nuage-site/pkg; then
            echo "::error::crates/nuage-site/pkg is out of date: run crates/nuage-site/build-wasm.sh (Rust 1.99) and commit pkg/"
            exit 1
          fi

  clients:
    name: Every language (clients/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runner has curl, Node, Python, PHP, Go, Ruby, Java, Kotlin, Swift, Perl and a C
      # compiler; the others are added.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dart-lang/setup-dart@v1
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: libcurl (for the C example)
        run: sudo apt-get update -q && sudo apt-get install -y -q libcurl4-openssl-dev
      - name: Build the server
        run: cargo build --locked -p nuage --bin nuage
      - name: Run each example against it
        run: clients/test.sh target/debug/nuage

  postgres:
    name: PostgreSQL drivers (clients/postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            clients/postgres/rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
      - name: Drivers (psql, psycopg, SQLAlchemy, node-postgres, Postgres.js, pg gem, JDBC)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client libpq-dev
          pip install -r clients/postgres/requirements.txt
          (cd clients/postgres && npm install --no-audit --no-fund)
          gem install pg --no-document
          curl -fsSLo clients/postgres/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
      - name: Build the server
        run: cargo build --locked -p nuage --bin nuage
      - name: Run each driver against it
        run: clients/postgres/test.sh target/debug/nuage

  install:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server
        run: cargo build --locked -p nuage --bin nuage
      # Windows PowerShell 5.1 reads a file without a byte order mark as Windows-1252: a
      # character outside ASCII ("→" holds the byte of "’") can end a string early.
      - name: The PowerShell scripts are ASCII
        if: runner.os == 'Linux'
        run: "! grep -nP '[^\\x00-\\x7F]' install.ps1 .github/install-test.ps1"
      # install.sh as a systemd service, backups to a folder of their own.
      - name: install.sh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /srv/backup-disk
          .github/install-test.sh target/debug/nuage /srv/backup-disk/nuage
      # install.sh as a launchd daemon, run as the runner's user.
      - name: install.sh (macOS)
        if: runner.os == 'macOS'
        run: .github/install-test.sh target/debug/nuage "$RUNNER_TEMP/nuage-backup"
      # install.ps1 as a scheduled task, backups on the runner's second drive.
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $drive = if (Test-Path 'D:\') { 'D:' } else { $env:RUNNER_TEMP }
          .github\install-test.ps1 target\debug\nuage.exe "$drive\nuage-backup"
