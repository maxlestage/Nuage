[package]
name = "nuage"
description = "Nuage DB: Memoire's own database, in pure Rust. Tables on disk in its own B-tree pages behind a write-ahead log, copy-on-write branches, backups to a directory or S3, an HTTP server and a management console. Embedded or as a server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/nuage"
readme = "README.md"
keywords = ["database", "embedded", "server", "orm", "branching"]
categories = ["database-implementations", "database", "web-programming::http-server"]
# The tests (and memoire-orm's backend suite, copied in tests/common) run from the repository.
exclude = ["tests"]

[features]
default = ["chrono", "uuid", "json", "site", "import-redb"]
## The website of Nuage DB (crates/nuage-site: pages, the live dashboard at `/app`, PWA),
## served by the `nuage` binary next to the database: `nuage::site()`. Without it, `/`
## is a small home page.
site = ["server", "dep:nuage-site"]
## The server: the database protocol over HTTP(S) (`/v1`), the PostgreSQL protocol, the
## console, the live status, `Db::Remote` (Memoire's client) and the `nuage` binary.
server = [
    "s3", "memoire-orm/nuage", "tokio/net", "tokio/signal", "dep:flate2",
    "hyper/server", "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots",
]
## Backups to S3-compatible storage (a small HTTP/1.1 client over rustls).
s3 = [
    "dep:tokio", "dep:hyper", "hyper/client", "hyper/http1", "dep:hyper-util", "dep:http-body-util",
    "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots",
]
## Reads the page store of Nuage DB up to 0.4 (a redb file, `nuage.redb`) once, to bring
## a data directory or a backup of those versions to this one. Nothing else uses redb:
## drop the feature once every database has been opened by this version.
import-redb = ["dep:redb"]
## Without `s3`, `server`, `site` and `import-redb` (`default-features = false`), Nuage DB is its embedded
## engine alone (`nuage::Embedded`, backups to a folder): pure Rust, no network stack, no
## C or assembly (cryptography from RustCrypto).
## Nuage DB always stores dates, UUIDs and JSON (memoire-orm's `chrono`, `uuid` and
## `json` features are on). These flags only say so to code shared with
## memoire-orm, such as its backend test suite.
chrono = []
uuid = []
json = []

[dependencies]
memoire-orm = { workspace = true }
nuage-site = { workspace = true, optional = true }
# Only to read the page store of versions up to 0.4 (feature `import-redb`).
redb = { version = "4", optional = true }
# `float_roundtrip` : sans elle, le parseur rapide de serde_json peut décaler un
# nombre d'un ULP (44.833800000000004 lu 44.8338) : un DOUBLE envoyé à /v1/sql
# doit arriver bit pour bit, comme par le protocole PostgreSQL.
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
getrandom = "0.4"
# Encryption at rest (see src/crypto.rs), all RustCrypto (pure Rust): XTS-AES-256 for the
# page store (`aes`), AES-256-GCM for the log, HKDF-SHA256, Argon2id when the key is a
# passphrase, base64 keys.
aes = "0.9"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
zeroize = "1"
uuid = "1"
# The server and the S3 client (features `server`, `s3`).
flate2 = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
memoire-orm = { workspace = true }
# The tests of the embedded engine run without the `server` feature.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }

[[bin]]
name = "nuage"
path = "src/main.rs"
required-features = ["server"]

[[example]]
name = "bench"
required-features = ["server"]
