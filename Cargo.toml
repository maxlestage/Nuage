[workspace]
resolver = "3"
members = ["crates/nuage", "crates/nuage-site", "crates/nuage-editor"]
# A bare `cargo build` or `cargo run` at the root is the server, as before the editor came
# (with two programs, `cargo run` would ask which one). The editor: `-p nuage-editor`.
default-members = ["crates/nuage", "crates/nuage-site"]

[workspace.package]
version = "0.4.8"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"
repository = "https://github.com/maxlestage/Nuage"
authors = ["Maxime Nathan Lestage"]

[workspace.dependencies]
# Pinned to a commit of Memoire: its `nuage-wire` feature has the protocol alone (no HTTP
# client), all the engine needs, and its client sends a table's schema once, then a reference
# (`schemaRefs` in `/v1/info`). The `server` feature adds Memoire's client (`nuage`).
# TODO: switch to memoire-orm 0.2.4 from crates.io once published
memoire-orm = { git = "https://github.com/maxlestage/Memoire", rev = "45f5a23", default-features = false, features = ["memory", "nuage-wire", "chrono", "uuid", "json"] }
nuage-site = { version = "0.1.0", path = "crates/nuage-site" }

# The server (`nuage`, Dockerfile, heroku-build.sh) and the examples: one code generation unit,
# optimized across crates (the engine calls Memoire's decoding for every value it reads):
# reads up to a third faster, a binary a quarter smaller, for a longer link.
[profile.release]
lto = "fat"
codegen-units = 1

# The browser bundle of the site (crates/nuage-site/build-wasm.sh): cargo build -p nuage-site
# --lib --target wasm32-unknown-unknown --profile wasm-release, then wasm-bindgen into pkg/.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false

# Nuage DB Editor, as released (.github/workflows/release.yml: --profile release-editor):
# a window does not need the server's whole-program optimization, and a lighter one links
# its large graphics crates much faster. No symbols: a smaller download. Unwinding stays
# on: a bug in the window shows a page saying so instead of closing it.
[profile.release-editor]
inherits = "release"
lto = "thin"
strip = "symbols"

# Argon2id (64 MiB, a passphrase as encryption key) and AES are slow without optimization:
# optimized even in debug, so `cargo test` stays fast.
[profile.dev.package]
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
aes = { opt-level = 3 }

# The editor's test programs link a window toolkit and a whole server: with their debug
# information they weigh 300 to 450 MB each. Without it, a few tens; panics still say their
# file and line, and backtraces their functions.
[profile.dev.package.nuage-editor]
strip = "debuginfo"
