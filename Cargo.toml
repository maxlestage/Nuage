[workspace]
resolver = "3"
members = ["crates/nuage", "crates/nuage-site"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"
repository = "https://github.com/maxlestage/Nuage"
authors = ["Maxime Nathan Lestage"]

[workspace.dependencies]
# Pinned to a commit of Memoire: its `nuage-wire` feature has the protocol alone (no HTTP
# client), all the engine needs, and its client sends a table's schema once, then a reference
# (`schemaRefs` in `/v1/info`). The `server` feature adds Memoire's client (`nuage`).
# TODO: switch to memoire-orm 0.2.1 from crates.io once published
memoire-orm = { git = "https://github.com/maxlestage/Memoire", rev = "66b9c38", default-features = false, features = ["memory", "nuage-wire", "chrono", "uuid", "json"] }
nuage-site = { version = "0.1.0", path = "crates/nuage-site" }

# The browser bundle of the site (crates/nuage-site/build-wasm.sh): cargo build -p nuage-site
# --lib --target wasm32-unknown-unknown --profile wasm-release, then wasm-bindgen into pkg/.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false

# Argon2id (64 MiB, a passphrase as encryption key) and AES are slow without optimization:
# optimized even in debug, so `cargo test` stays fast.
[profile.dev.package]
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
aes = { opt-level = 3 }
